name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/landing/**"
      - "apps/studio/**"
      - ".github/scripts/compile_docs.py"
      - ".github/scripts/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "site/landing/**"
      - "apps/studio/**"
      - ".github/scripts/compile_docs.py"
      - ".github/scripts/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r .github/scripts/docs-requirements.txt

      - name: Build docs and landing page (pure Python, no VitePress)
        run: python .github/scripts/compile_docs.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Build Studio frontend
        run: |
          cd apps/studio/src
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx vite build --base /studio/ --outDir ../dist --emptyOutDir
          rm -rf ../../site/studio
          mkdir -p ../../site/studio
          cp -a ../../dist/. ../../site/studio/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
